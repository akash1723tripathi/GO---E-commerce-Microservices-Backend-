syntax = "proto3";

package pb;
option go_package = "github.com/akash1723tripathi/go-microservices/order/pb";

import "google/protobuf/timestamp.proto";

message OrderedProduct {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  uint32 quantity = 5;
}

message Order {
  string id = 1;
  string account_id = 2;
  google.protobuf.Timestamp created_at = 3;
  double total_price = 4;
  repeated OrderedProduct products = 5;
}

message PostOrderRequest {
  string account_id = 1;
  repeated OrderedProduct products = 2;
}

message PostOrderResponse { Order order = 1; }
message GetOrderRequest { string id = 1; }
message GetOrderResponse { Order order = 1; }
message GetOrdersRequest { string account_id = 1; uint64 skip = 2; uint64 take = 3; }
message GetOrdersResponse { repeated Order orders = 1; }

service OrderService {
  rpc PostOrder(PostOrderRequest) returns (PostOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
}
